<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandy ValVal Photography Studio</title>
<meta name="description" content="Sandy ValVal Photography Studio — Fotografía con propósito. Retratos con alma. Phoenix, Arizona.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Parisienne&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0c0a0d;
    --charcoal:#171216;
    --charcoal-2:#1e181c;
    --bordeaux:#4a1524;
    --bordeaux-light:#6e2334;
    --gold:#c69a54;
    --gold-light:#e9cd94;
    --gold-dim:#8a6f3f;
    --cream:#f4ead9;
    --cream-dim:rgba(244,234,217,.68);
    --cream-faint:rgba(244,234,217,.4);
    --line:rgba(198,154,84,.25);
    --serif:'Playfair Display', serif;
    --script:'Parisienne', cursive;
    --sans:'Jost', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background: radial-gradient(ellipse at 50% 0%, var(--charcoal-2) 0%, var(--black) 60%);
    color: var(--cream);
    font-family: var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  body{
    display:flex; justify-content:center;
    padding: 48px 18px 70px;
  }
  .card{
    width:100%; max-width:420px;
    position:relative;
  }
  .frame{
    position:relative;
    border:1px solid var(--line);
    padding: 34px 26px 30px;
    text-align:center;
    background: linear-gradient(180deg, rgba(198,154,84,.05), transparent 40%);
  }
  .corner{ position:absolute; width:20px; height:20px; border-color:var(--gold); }
  .corner.tl{ top:8px; left:8px; border-top:1px solid; border-left:1px solid; }
  .corner.tr{ top:8px; right:8px; border-top:1px solid; border-right:1px solid; }
  .corner.bl{ bottom:8px; left:8px; border-bottom:1px solid; border-left:1px solid; }
  .corner.br{ bottom:8px; right:8px; border-bottom:1px solid; border-right:1px solid; }

  .avatar{
    width:104px; height:104px;
    margin:0 auto 18px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid var(--gold);
    box-shadow:0 0 0 5px rgba(198,154,84,.12);
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }

  .logo-script{
    font-family: var(--script);
    font-size: 46px;
    color: var(--gold-light);
    text-shadow: 0 0 20px rgba(198,154,84,.3);
    line-height:1;
  }
  .kicker{
    margin-top:10px;
    display:flex; align-items:center; justify-content:center; gap:12px;
    font-size:11px; letter-spacing:4px; text-transform:uppercase; color:var(--gold);
  }
  .kicker .ln{ width:26px; height:1px; background:linear-gradient(to right, transparent, var(--gold-dim)); }
  .kicker .ln.r{ background:linear-gradient(to left, transparent, var(--gold-dim)); }
  .tagline{
    margin-top:18px;
    font-family: var(--serif);
    font-style: italic;
    font-weight:500;
    font-size:14px;
    color:var(--cream-dim);
  }
  .loc{
    margin-top:14px;
    font-size:10.5px; letter-spacing:3px; text-transform:uppercase; color:rgba(198,154,84,.6);
  }

  .actions{
    margin-top:26px;
    display:flex; flex-direction:column; gap:10px;
  }
  .btn{
    display:flex; align-items:center; gap:12px;
    padding:14px 18px;
    border:1px solid var(--line);
    background: rgba(244,234,217,.02);
    color: var(--cream);
    text-decoration:none;
    font-family: var(--sans);
    font-size:14px; letter-spacing:.3px;
    transition: border-color .2s, background .2s, transform .2s;
  }
  .btn:hover{ border-color:var(--gold); background: rgba(198,154,84,.07); transform: translateY(-1px); }
  .btn .ic{
    width:18px; height:18px; flex:none;
    color:var(--gold);
  }
  .btn .ic svg{ width:100%; height:100%; }
  .btn.primary{
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: var(--black);
    border-color: transparent;
    font-weight:600;
    justify-content:center;
  }
  .btn.primary .ic{ color: var(--black); }
  .btn.primary:hover{ filter:brightness(1.06); transform: translateY(-1px); }

  .divider{
    margin: 26px 0 18px;
    display:flex; align-items:center; gap:14px;
    color: var(--gold-dim);
    font-size:10.5px; letter-spacing:3px; text-transform:uppercase;
  }
  .divider .ln{ flex:1; height:1px; background:var(--line); }

  .socials{
    display:flex; justify-content:center; gap:16px;
  }
  .socials a{
    width:42px; height:42px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line);
    color:var(--gold);
    text-decoration:none;
    transition: border-color .2s, color .2s, transform .2s;
  }
  .socials a:hover{ border-color:var(--gold); color:var(--gold-light); transform: translateY(-2px); }
  .socials svg{ width:18px; height:18px; }

  .save{
    margin-top:22px;
    text-align:center;
  }
  .save a{
    color: var(--gold);
    font-size:12.5px; letter-spacing:1px;
    text-decoration:none;
    border-bottom:1px solid var(--line);
    padding-bottom:2px;
  }
  .save a:hover{ border-color:var(--gold); }

  .foot{
    margin-top:34px;
    text-align:center;
    font-size:10.5px;
    letter-spacing:1px;
    color: var(--cream-faint);
  }
  .foot a{ color:var(--gold); text-decoration:none; }

  @media (max-width:380px){
    .logo-script{ font-size:38px; }
  }
</style>
</head>

    // Fold the PHOTO property per vCard 3.0 line-length rules (75 chars, continuation lines start with a space).
    function foldPhoto(b64){
      var prefix = "PHOTO;ENCODING=b;TYPE=JPEG:";
      var data = prefix + b64;
      var out = [data.slice(0,75)];
      var rest = data.slice(75);
      while (rest.length) {
        out.push(" " + rest.slice(0,74));
        rest = rest.slice(74);
      }
      return out.join("\r\n");
    }
